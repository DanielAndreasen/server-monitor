[project]
name = "server-monitor"
version = "0.1.0"
description = "Self-hosted service monitor for the home-server home server"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "celery",
    "redis",
    "prometheus-client",
    "httpx",
    "pytest",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server_monitor"]
