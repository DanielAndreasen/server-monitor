# Healthcheck probes for server-monitor (issue #6).
#
# The worker loads this file every 30 minutes (Celery beat entry
# "healthchecks-every-30min") and runs each probe listed under `checks`.
# In production, docker-compose.prod.yml mounts this file into the worker
# read-only at /config/healthchecks.yaml; the path is read from the
# HEALTHCHECKS_CONFIG env var and defaults to ./healthchecks.yaml.
#
# Every check needs a unique `name` (it becomes the Redis snapshot key
# and the `server_monitor_check_up{check="..."}` metric label) and a `type`.
# One result snapshot is written per check name on every run.
#
# Supported types and their options (defaults shown):
#
#   http:      {name, type: http, url, expected_status: 200, timeout_s: 5}
#              ok when GET url answers with expected_status.
#   container: {name, type: container, container_name}
#              ok when the Docker container is running and (if it has a
#              HEALTHCHECK) healthy; read via the read-only docker socket.
#   disk:      {name, type: disk, path: /, warn_percent: 80, fail_percent: 90}
#              status "warn" when used% > warn_percent, "fail" when > fail_percent.
#   internet:  {name, type: internet, url: https://cloudflare.com/cdn-cgi/trace, timeout_s: 5}
#              ok when the probe endpoint answers at all; "fail" only after
#              2 consecutive failures (tracked in Redis,
#              key server_monitor:consec-fail:<name>).
#   fail2ban:  {name, type: fail2ban, socket: /var/run/fail2ban/fail2ban.sock,
#               max_recent_bans: 10}
#              ok when the total currently-banned count across all jails is
#              <= max_recent_bans; queried via the read-only fail2ban socket.
#
# Issue #20 probe types (all read-only against the host; the prod compose
# mounts host /proc, /sys, /var/run and the backup dir read-only):
#
#   cert-expiry:       {name, type: cert-expiry, host, port: 443, timeout_s: 5,
#                       warn_days: 14, fail_days: 7}
#                      TLS handshake to host:port, read the peer cert's
#                      notAfter; "warn" when fewer than warn_days remain,
#                      "fail" when fewer than fail_days remain.
#   load:              {name, type: load, loadavg_path: /proc/loadavg,
#                       meminfo_path: /proc/meminfo, warn_load: 4.0,
#                       fail_load: 8.0, mem_warn_percent: 80, mem_fail_percent: 90}
#                      1-min loadavg + used memory %; reports the worse of the
#                      load status (warn/fail above warn_load/fail_load) and
#                      the memory status (above mem_warn_percent/mem_fail_percent).
#   temperature:       {name, type: temperature,
#                       sensor: /sys/class/thermal/thermal_zone0/temp,
#                       warn_c: 70, fail_c: 85}
#                      reads millidegrees from the sensor file; "warn"/"fail"
#                      strictly above warn_c/fail_c.
#   reboot-required:   {name, type: reboot-required, path: /var/run/reboot-required}
#                      "warn" when the marker file exists, "ok" when absent.
#   backup-freshness:  {name, type: backup-freshness, dir: /mnt/backups,
#                       max_age_hours: 26}
#                      newest file mtime in dir; "fail" when older than
#                      max_age_hours (an empty/unreadable dir also fails).
#   tcp-port:          {name, type: tcp-port, host, port, timeout_s: 5}
#                      bare TCP connect; "fail" on refusal/timeout.
#   error-scan:        {name, type: error-scan, log: /var/log/syslog,
#                       since_minutes: 60, max_errors: 20, journal: false}
#                      counts ERROR/CRITICAL lines in the last since_minutes
#                      of the log ("fail" above max_errors); with
#                      journal: true the lines come from
#                      `journalctl --since` instead of the log file.
#
# Unknown keys inside a check entry are rejected at load time, like
# unknown types.
#
# Example tuned for a home-server-style deployment (all five types; every
# address is a placeholder — the public-repo rule forbids committing real
# internal hostnames/IPs, so replace them with your own services, using
# example.com-style URLs for anything external):

checks:
  # 1. HTTP probe of the monitor's own /health endpoint.
  - name: web-self
    type: http
    url: http://localhost:8000/health
    expected_status: 200    # default 200
    timeout_s: 5            # default 5

  # 2. HTTP probe of a self-hosted service (Gotify here — placeholder URL).
  - name: gotify
    type: http
    url: https://gotify.example.com/health
    expected_status: 200
    timeout_s: 5

  # 3. Docker container state/health (via the read-only docker.sock mount).
  - name: redis-container
    type: container
    container_name: redis   # compose service name of a container on the host

  # 4. Disk usage of the root filesystem.
  - name: root-disk
    type: disk
    path: /                 # default /
    warn_percent: 80        # default 80 (status "warn" above this)
    fail_percent: 90        # default 90 (status "fail" above this)

  # 5. Internet connectivity probe against a stable endpoint.
  - name: internet
    type: internet
    url: https://cloudflare.com/cdn-cgi/trace   # default probe endpoint
    timeout_s: 5                               # default 5

  # 6. Malicious-access check: recent fail2ban bans across all jails.
  - name: fail2ban
    type: fail2ban
    socket: /var/run/fail2ban/fail2ban.sock    # default socket path
    max_recent_bans: 10                        # default 10

