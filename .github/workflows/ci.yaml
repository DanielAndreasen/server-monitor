name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Validate docker-compose.yml parses as YAML
        run: |
          uv run --with pyyaml python -c "import yaml; yaml.safe_load(open('docker-compose.yml')); print('docker-compose.yml: valid YAML')"
