# Production overrides for deploying server-monitor on the home server (issue #9).
#
# Use together with the base file — this file keeps every base service
# (redis, worker, beat, web) and only adds what the checks need on the
# real host:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What it adds:
#   * worker gets read-only bind mounts of the host paths the checks read:
#     - /var/run/docker.sock          Docker Engine API (image + container checks)
#     - /etc/apt, /var/lib/apt/lists, /var/lib/dpkg   host apt state (apt check)
#     - host docker config dir        registry auth for digest checks
#     - /var/run/fail2ban/fail2ban.sock   fail2ban malicious-access check
#     - /proc, /sys, /var/run         host load/mem (load check), temperature
#                                       (thermal zones), reboot-required marker
#                                       (issue #20 probes)
#     - $BACKUP_DIR (default /mnt/backups), mounted at the same path
#                                       backup-freshness check (issue #20)
#     - ./healthchecks.yaml           mounted at /config/healthchecks.yaml
#   * worker env: DOCKER_SOCK and HEALTHCHECKS_CONFIG point at those mounts.
#   * worker + beat get TZ so Celery Beat's 06:00 apt check and 09:00 digest
#     run at local time (compose default is UTC; set TZ in .env, e.g.
#     TZ=Europe/Copenhagen).
#
# The host docker config dir defaults to $HOME/.docker on the host (i.e.
# ~/.docker); override with HOST_DOCKER_CONFIG in .env if it lives elsewhere.
# The backup dir defaults to /mnt/backups on the host; override with
# BACKUP_DIR in .env if your backups live elsewhere (it is mounted at the
# same path inside the worker, read-only).

services:
  worker:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/apt:/etc/apt:ro
      - /var/lib/apt/lists:/var/lib/apt/lists:ro
      - /var/lib/dpkg:/var/lib/dpkg:ro
      - ${HOST_DOCKER_CONFIG:-$HOME/.docker}:/root/.docker:ro
      - /var/run/fail2ban/fail2ban.sock:/var/run/fail2ban/fail2ban.sock:ro
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /var/run:/var/run:ro
      - ${BACKUP_DIR:-/mnt/backups}:${BACKUP_DIR:-/mnt/backups}:ro
      - ./healthchecks.yaml:/config/healthchecks.yaml:ro
    environment:
      - DOCKER_SOCK=/var/run/docker.sock
      - HEALTHCHECKS_CONFIG=/config/healthchecks.yaml
      - TZ=${TZ:-UTC}

  beat:
    environment:
      - TZ=${TZ:-UTC}
